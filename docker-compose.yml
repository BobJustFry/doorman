services:
  # Caddy and the admin app share the host network: Caddy can then listen on any
  # port the admin panel asks for (80/443 plus extra ports), sees real client IPs
  # and reaches LAN hosts directly. The two talk over 127.0.0.1 only.
  caddy:
    image: caddy:2
    container_name: doorman-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/caddy.json:/etc/caddy/caddy.json:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json", "--resume"]
    # Least privilege: the proxy faces the internet, so it keeps only the right to bind ports
    # 80/443, cannot gain more, and cannot write anywhere except its own volumes.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    pids_limit: 512

  admin:
    build: ./admin
    container_name: doorman-admin
    restart: unless-stopped
    network_mode: host
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-}
      ADMIN_TLS: ${ADMIN_TLS:-auto}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Panel listens on ADMIN_BIND:ADMIN_PORT (127.0.0.1 by default: use an SSH tunnel
      # or ADMIN_DOMAIN, which Caddy serves over HTTPS for the LAN only).
      ADMIN_BIND: ${ADMIN_BIND:-127.0.0.1}
      ADMIN_PORT: ${ADMIN_PORT:-8080}
      CADDY_ADMIN_URL: http://127.0.0.1:2019
      DATA_DIR: /data
    volumes:
      - admin_data:/data
      - caddy_logs:/logs:ro
    depends_on: [caddy]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    pids_limit: 256
    mem_limit: 512m

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  admin_data:

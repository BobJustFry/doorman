<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Address not connected</title>
<style>
  :root { --card: rgba(255,255,255,.14); --line: rgba(255,255,255,.28); --fg: #fff; --muted: rgba(255,255,255,.75); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: radial-gradient(circle at 15% 20%, #7c5cff 0, transparent 45%),
                radial-gradient(circle at 85% 80%, #00c2a8 0, transparent 45%), #1b1f3b; }
  .card { width: min(440px, 100%); padding: 32px 28px; border-radius: 22px; text-align: center;
    background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .icon { font-size: 44px; margin-bottom: 8px; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0; color: var(--muted); }
  .host { display: inline-block; margin-top: 18px; padding: 6px 14px; border-radius: 999px; background: rgba(0,0,0,.25);
    font: 14px ui-monospace, Menlo, Consolas, monospace; max-width: 100%; overflow-wrap: anywhere; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔌</div>
    <h1>This address isn't connected</h1>
    <p>The domain points here, but no service is set up for it yet.</p>
    <span class="host" id="host"></span>
  </div>
  <script>document.getElementById('host').textContent = location.hostname;</script>
</body>
</html>

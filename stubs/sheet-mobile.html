<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stubs · phone sheet</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px 16px; background: #e9ebf0; color: #1c2230; font: 14px/1.3 system-ui, sans-serif; overflow-x: hidden; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
  h1 { margin: 0; font-size: 18px; }
  a { color: #3b6cf6; text-decoration: none; font-weight: 600; }
  #stage { transform-origin: top left; width: 1960px; display: flex; gap: 40px; }
  .cell { width: 360px; }
  .cell h2 { margin: 0 0 10px; font-size: 24px; text-align: center; }
  .phone { width: 360px; height: 760px; background: #fff; border: 10px solid #20232b; border-radius: 44px; overflow: hidden; }
  iframe { width: 340px; height: 740px; border: 0; display: block; }
</style>
</head>
<body>
  <header><h1>Phone view</h1><a href="sheet-desktop.html">← Desktop sheet</a></header>
  <div id="wrap"><div id="stage">
    <div class="cell"><h2>1 · Minimal</h2><div class="phone"><iframe src="1-minimal.html"></iframe></div></div>
    <div class="cell"><h2>2 · Glass</h2><div class="phone"><iframe src="2-glass.html"></iframe></div></div>
    <div class="cell"><h2>3 · Terminal</h2><div class="phone"><iframe src="3-terminal.html"></iframe></div></div>
    <div class="cell"><h2>4 · Door</h2><div class="phone"><iframe src="4-door.html"></iframe></div></div>
    <div class="cell"><h2>5 · Status card</h2><div class="phone"><iframe src="5-status.html"></iframe></div></div>
  </div></div>
<script>
  function fit() {
    const stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
    const s = (window.innerWidth - 32) / stage.offsetWidth;
    stage.style.transform = 'scale(' + s + ')';
    wrap.style.height = stage.offsetHeight * s + 'px';
  }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>

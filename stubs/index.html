<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stub pages</title>
<style>
  body { margin: 0; padding: 24px; background: #e9ebf0; font: 15px/1.4 system-ui, sans-serif; color: #1c2230; }
  h1 { margin: 0 0 4px; font-size: 22px; } .sub { margin: 0 0 24px; color: #667085; }
  .item { margin-bottom: 36px; }
  .item h2 { margin: 0 0 10px; font-size: 16px; }
  .row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .frame { background: #fff; border: 1px solid #cfd3dc; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 10px #0001; }
  .desktop iframe { width: 720px; height: 420px; border: 0; display: block; }
  .phone { border-radius: 26px; border-width: 6px; border-color: #20232b; }
  .phone iframe { width: 300px; height: 540px; border: 0; display: block; }
  .tag { font-size: 12px; color: #667085; margin: 4px 0 0; }
</style>
</head>
<body>
  <h1>Stub pages</h1>
  <p class="sub">Desktop and phone view of each variant. Light/dark follows the system theme.</p>
  <div class="item"><h2>1 · Minimal</h2><div class="row">
    <div><div class="frame desktop"><iframe src="1-minimal.html"></iframe></div><p class="tag">Desktop</p></div>
    <div><div class="frame phone"><iframe src="1-minimal.html"></iframe></div><p class="tag">Phone</p></div></div></div>
  <div class="item"><h2>2 · Glass</h2><div class="row">
    <div><div class="frame desktop"><iframe src="2-glass.html"></iframe></div><p class="tag">Desktop</p></div>
    <div><div class="frame phone"><iframe src="2-glass.html"></iframe></div><p class="tag">Phone</p></div></div></div>
  <div class="item"><h2>3 · Terminal</h2><div class="row">
    <div><div class="frame desktop"><iframe src="3-terminal.html"></iframe></div><p class="tag">Desktop</p></div>
    <div><div class="frame phone"><iframe src="3-terminal.html"></iframe></div><p class="tag">Phone</p></div></div></div>
  <div class="item"><h2>4 · Door</h2><div class="row">
    <div><div class="frame desktop"><iframe src="4-door.html"></iframe></div><p class="tag">Desktop</p></div>
    <div><div class="frame phone"><iframe src="4-door.html"></iframe></div><p class="tag">Phone</p></div></div></div>
  <div class="item"><h2>5 · Status card</h2><div class="row">
    <div><div class="frame desktop"><iframe src="5-status.html"></iframe></div><p class="tag">Desktop</p></div>
    <div><div class="frame phone"><iframe src="5-status.html"></iframe></div><p class="tag">Phone</p></div></div></div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nobody's home</title>
<style>
  :root { --bg: #eef1f7; --fg: #1f2433; --muted: #6a7188; --door: #3b4a7a; --door2: #2c3860; --light: #ffd66b; --floor: #d5dae8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151826; --fg: #eceff8; --muted: #8b92aa; --door: #4a5a94; --door2: #36447a; --floor: #1f2336; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  svg { width: min(220px, 55vw); height: auto; }
  h1 { margin: 18px 0 6px; font-size: clamp(22px, 5vw, 30px); }
  p { margin: 0 auto; max-width: 30em; color: var(--muted); }
  code { font: 14px ui-monospace, Menlo, Consolas, monospace; color: var(--fg); overflow-wrap: anywhere; }
  .glow { animation: pulse 3.2s ease-in-out infinite; transform-origin: center; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }
</style>
</head>
<body>
  <main>
    <svg viewBox="0 0 200 240" role="img" aria-label="A door standing slightly open">
      <rect x="0" y="212" width="200" height="6" rx="3" fill="var(--floor)"/>
      <polygon class="glow" points="100,40 100,212 170,236 170,16" fill="var(--light)" opacity=".35"/>
      <rect x="52" y="24" width="96" height="188" rx="6" fill="var(--door2)"/>
      <polygon points="52,24 112,34 112,206 52,212" fill="var(--door)"/>
      <circle cx="102" cy="124" r="4.5" fill="var(--light)"/>
      <rect x="64" y="46" width="36" height="52" rx="3" fill="var(--door2)" opacity=".7"/>
      <rect x="64" y="108" width="36" height="78" rx="3" fill="var(--door2)" opacity=".7"/>
    </svg>
    <h1>Nobody's home</h1>
    <p><code id="host"></code> reached the doorman, but there's no room behind this address yet.</p>
  </main>
  <script>document.getElementById('host').textContent = location.hostname;</script>
</body>
</html>

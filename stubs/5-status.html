<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Service not configured</title>
<style>
  :root { --bg: #f3f4f7; --card: #fff; --fg: #1c2230; --muted: #667085; --line: #e3e6ee; --accent: #3b6cf6; --warn: #d97706; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151c; --card: #1b2030; --fg: #e6e9f0; --muted: #8b93a7; --line: #2a3045; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width: min(520px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  header { display: flex; gap: 12px; align-items: center; padding: 20px 22px; border-bottom: 1px solid var(--line); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 4px #d9770633; flex: none; }
  h1 { margin: 0; font-size: 18px; }
  .body { padding: 20px 22px; }
  .body p { margin: 0 0 16px; color: var(--muted); }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, Menlo, Consolas, monospace; }
  footer { padding: 12px 22px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  @media (max-width: 380px) { dl { grid-template-columns: 1fr; gap: 2px; } dd { margin-bottom: 8px; } }
</style>
</head>
<body>
  <div class="card">
    <header><span class="dot"></span><h1>This domain is not configured</h1></header>
    <div class="body">
      <p>The request reached the server, but no service is assigned to this address. If you manage it, add a route in the admin panel.</p>
      <dl>
        <dt>Address</dt><dd id="host"></dd>
        <dt>Status</dt><dd>404 · Not configured</dd>
      </dl>
    </div>
    <footer>Doorman</footer>
  </div>
  <script>document.getElementById('host').textContent = location.hostname;</script>
</body>
</html>

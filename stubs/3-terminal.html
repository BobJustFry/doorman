<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>route not found</title>
<style>
  :root { --bg: #0c0f0c; --fg: #b8f5b8; --dim: #5c8a5c; --warn: #ffb454; }
  @media (prefers-color-scheme: light) { :root { --bg: #f4f7f4; --fg: #14532d; --dim: #5b7a64; --warn: #b45309; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: clamp(16px, 5vw, 48px); background: var(--bg); color: var(--fg);
    font: clamp(13px, 3.4vw, 16px)/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .dim { color: var(--dim); } .warn { color: var(--warn); }
  pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cursor { display: inline-block; width: .6em; height: 1.1em; vertical-align: text-bottom; background: var(--fg);
    animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>
<pre><span class="dim">$</span> doorman route <span id="host"></span>
<span class="warn">error 404:</span> no route configured for this host
<span class="dim">hint:</span> add it in the Doorman admin panel

<span class="dim">$</span> <span class="cursor"></span></pre>
<script>document.getElementById('host').textContent = location.hostname;</script>
</body>
</html>

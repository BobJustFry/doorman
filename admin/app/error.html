<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232c3860'/%3E%3Crect x='9' y='5' width='14' height='22' rx='2' fill='%237b8fd8'/%3E%3Ccircle cx='20' cy='16' r='1.3' fill='%23ffd66b'/%3E%3C/svg%3E">
<title>Service not responding</title>
<style>
  :root { --bg: #eef1f7; --fg: #1f2433; --muted: #6a7188; --door: #3b4a7a; --door2: #2c3860; --light: #ffd66b; --floor: #d5dae8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151826; --fg: #eceff8; --muted: #8b92aa; --door: #4a5a94; --door2: #36447a; --floor: #1f2336; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  svg { width: min(200px, 50vw); height: auto; }
  h1 { margin: 18px 0 6px; font-size: clamp(22px, 5vw, 30px); }
  p { margin: 0 auto 10px; max-width: 30em; color: var(--muted); }
  code { font: 14px ui-monospace, Menlo, Consolas, monospace; color: var(--fg); overflow-wrap: anywhere; }
  button { margin-top: 8px; font: inherit; padding: 9px 18px; border-radius: 10px; border: 0; background: #3b6cf6; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <svg viewBox="0 0 200 240" role="img" aria-label="A closed door">
      <rect x="0" y="212" width="200" height="6" rx="3" fill="var(--floor)"/>
      <rect x="52" y="24" width="96" height="188" rx="6" fill="var(--door2)"/>
      <rect x="60" y="32" width="80" height="172" rx="4" fill="var(--door)"/>
      <rect x="70" y="46" width="60" height="62" rx="3" fill="var(--door2)" opacity=".6"/>
      <rect x="70" y="118" width="60" height="74" rx="3" fill="var(--door2)" opacity=".6"/>
      <circle cx="128" cy="116" r="4.5" fill="var(--light)"/>
    </svg>
    <h1>The service is not answering</h1>
    <p><code id="host"></code> is set up, but the service behind it did not respond. It may be restarting or switched off.</p>
    <p>Please try again in a minute. If it keeps happening, tell the administrator.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>document.getElementById('host').textContent = location.hostname;</script>
</body>
</html>
